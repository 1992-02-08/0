name: Update Subscription

on:
  schedule:
    # 每日 0 点 (北京时间 UTC+8) = 16:00 UTC
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Build merged subscription
        env:
          SUBMERGE_REPO: ${{ github.repository }}
        run: |
          python3 merge.py
          python3 gen_artifacts.py
          cp dist/* .

      - name: Commit and push
        run: |
          git config user.name  "SubMerge Bot"
          git config user.email "submerge@users.noreply.github.com"
          git add clash.yaml base64.txt nodes.txt meta.json index.html
          git diff --cached --quiet || git commit -m "auto: update subscription $(date -u '+%F %T') UTC"
          git push
